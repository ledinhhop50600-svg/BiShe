# ===== 服务配置 =====
server.port=8080
spring.application.name=zimeiti-backend

# ===== 数据库（使用专用账号 zimeiti，非 root）=====
spring.datasource.url=jdbc:mysql://localhost:3306/zimeiti?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=zimeiti
spring.datasource.password=zimeiti2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis-Plus =====
# 数据库下划线字段名 -> Java 驼峰属性名（user_name -> userName）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 主键自增策略
mybatis-plus.global-config.db-config.id-type=auto
# 开发期打印 SQL：排查问题时再打开；它会明显拖慢查询并在控制台刷屏
# mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== 运行参数（降低常驻内存）=====
# Tomcat 线程上限：默认 200 对本地演示过大，实际并发只有个位数
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
# Hikari 连接池：默认 10 个连接；本地演示 5 个足够
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ===== Sa-Token =====
sa-token.token-name=satoken
# 登录会话有效期 30 天（单位：秒）
sa-token.timeout=2592000
# 安全：只从请求头读令牌。禁止 Cookie / 请求体/URL 参数，避免 ?satoken=... 或 Cookie 泄露。
sa-token.is-read-cookie=false
sa-token.is-read-body=false
sa-token.is-read-header=true
sa-token.is-write-header=true

# ===== 智能体服务 =====
# 智能体是独立的 Python 服务（agent/ 目录），见 docs/Agent接口契约-v1.md
agent.base-url=http://localhost:8001
# 主系统侧超时 30 秒；智能体内部模型超时 25 秒（保证 Agent 先返回明确错误）
agent.timeout-seconds=30
# 可选的共享口令，留空表示不校验
agent.token=

# ===== 评测中心 =====
# 后端默认从 backend/ 启动，项目根目录是上一级；直接 java -jar 从根目录启动时改成 .
eval.project-root=..
# 运行 Python 评测脚本的解释器（需在 PATH 中，或写绝对路径）
eval.python=python

# ===== 日志 =====
logging.level.com.zimeiti=debug
