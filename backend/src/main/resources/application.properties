# ===== 服务配置 =====
server.port=8080
spring.application.name=zimeiti-backend

# ===== 数据库（使用专用账号 zimeiti，非 root）=====
spring.datasource.url=jdbc:mysql://localhost:3306/zimeiti?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=zimeiti
spring.datasource.password=zimeiti2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis-Plus =====
# 数据库下划线字段名 -> Java 驼峰属性名（user_name -> userName）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 主键自增策略
mybatis-plus.global-config.db-config.id-type=auto
# 开发期打印 SQL，方便排查（答辩演示前可注释掉）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== Sa-Token =====
sa-token.token-name=satoken
# 登录会话有效期 30 天（单位：秒）
sa-token.timeout=2592000

# ===== 智能体服务 =====
# 智能体是独立的 Python 服务（agent/ 目录），见 docs/Agent接口契约-v1.md
agent.base-url=http://localhost:8001
# 主系统侧超时 30 秒；智能体内部模型超时 25 秒（保证 Agent 先返回明确错误）
agent.timeout-seconds=30
# 可选的共享口令，留空表示不校验
agent.token=

# ===== 日志 =====
logging.level.com.zimeiti=debug
